name: Research checks
on:
  pull_request:
    paths:
      - 'data/scripts/**'
      - 'tests/**'
      - 'tools/maintenance/**'
      - '.github/workflows/research.yml'
  push:
    branches: [main]
    paths:
      - 'data/scripts/**'
      - 'tests/**'
      - 'tools/maintenance/**'
      - '.github/workflows/research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/check_public_assets.py
      - run: python -m compileall -q data/scripts tools/maintenance tests
      - run: python -m pip install -r data/scripts/requirements-test.txt
      - run: python -m pytest tests --ignore=tests/test_manual_box_experiment.py -q
      - run: python -m pytest data/scripts/test_stage2_features.py -q
      - run: node tests/manual_box_review_frontend.cjs
