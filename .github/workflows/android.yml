name: Android debug build
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'examples/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android web assets with the project API
        env:
          VITE_API_BASE_URL: ${{ vars.MARS_ANDROID_API_BASE_URL || 'https://alanspace.cn/mars' }}
        run: |
          node -e 'const url = new URL(process.env.VITE_API_BASE_URL); if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) throw new Error("Android API base must be an HTTPS URL without credentials, query, or fragment")'
          npm ci
          npm run android:sync
        working-directory: mobile
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: mars-atlas-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
