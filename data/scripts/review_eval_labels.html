<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整图评估修框</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:16px/1.5 system-ui}header{padding:14px 20px;background:#151515}h1{margin:0;font-size:23px}p{margin:8px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}button,select,input,textarea{font:inherit;background:#222;color:#eee;border:1px solid #555;padding:8px;border-radius:6px}button{cursor:pointer}button.primary{background:#205e45}button.danger{background:#552626}button:disabled{opacity:.45;cursor:default}.viewport{height:72vh;overflow:auto;border:1px solid #444;background:#000}canvas{display:block;touch-action:none;cursor:crosshair}aside{padding:15px;background:#151515;border:1px solid #333;border-radius:8px}aside input:not([type=checkbox]),aside textarea{width:100%}textarea{height:80px}.help{font-size:14px;color:#bbb}.objects{max-height:25vh;overflow:auto}.object{display:flex;gap:6px;margin:6px 0}.object button:first-child{flex:1}.selected{outline:2px solid #80d9ff}#status{color:#9ee0b5;min-height:28px}a{color:#93caff}@media(max-width:900px){.layout{grid-template-columns:1fr}.viewport{height:65vh}}
</style>
<header><h1>整图评估修框</h1><p>检查整张图，框出所有可识别滑坡，包括顶部和底部。图片边缘的目标只框可见部分。绿色是人工框，黄色是旧矩形框，红色是原始SHP多边形。</p><p class="help">SHP仅供参考，可能遗漏或圈得不准，请以图像判断。看不清的图片请暂扣；确认整张图无滑坡时，单独勾选空图确认。模型预测不显示。</p></header>
<div class="layout"><main><p id="progress"></p><div class="tools"><label>批次 <select id="batch"></select></label><button id="prev">上一张</button><select id="image" aria-label="当前图片"></select><button id="next">下一张</button></div>
<div class="tools"><button id="add">新增滑坡框</button><button id="redraw">重画选中框</button><label><input type="checkbox" id="reference">显示旧框</label><label><input type="checkbox" id="polygon">显示SHP多边形</label><span id="polygonInfo" class="help"></span><button id="copy">载入旧框作草稿</button><label>放大 <input id="zoom" type="range" min="1" max="4" step=".25" value="1"></label><button id="undo">撤销上一步</button></div>
<div id="viewport" class="viewport"><canvas id="canvas" aria-label="拖动绘制滑坡框"></canvas></div><p id="identity" class="help"></p></main>
<aside><strong id="mode">拖动新增滑坡框</strong><p class="help">一张图可以有多个滑坡框。选中列表中的框，再点“重画选中框”修订；误框可删除。</p><div id="objects" class="objects"></div>
<label>审核人<input id="reviewer" value="用户" maxlength="100"></label><label>判断依据／修订说明<textarea id="reason" maxlength="2000" placeholder="例如：补全底部；删除误标；确认原框准确；全图无滑坡"></textarea></label>
<p><label><input type="checkbox" id="confirmed">我已检查整张图片</label></p><p class="help">确认保存前，请框出全部可识别滑坡；无法判断时可以暂扣整张图。</p><p><label><input type="checkbox" id="empty">我确认整张图片没有滑坡（空标签专用）</label></p>
<button id="save" class="primary">确认并保存本图</button><p class="help">看不清或边界无法判断时，写明原因并暂扣整张图，不记为背景。</p><button id="hold" class="danger">本图看不清，暂扣</button><p id="saved" class="help"></p><p id="status" role="status"></p></aside></div>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
let state,items,item,img,polygons=[],boxes=[],selected=-1,mode='add',start=null,draft=null,dirty=false,busy=false,revision=0,undo=[],version=0,lastImage,lastBatch;
async function request(url,options){const r=await fetch(url,options),v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}
function notify(v){$('status').textContent=v}
function enable(){for(const id of ['batch','image','prev','next','add','redraw','copy','undo','save','hold','reviewer','reason','confirmed','empty'])$(id).disabled=busy||!img;for(const b of $('objects').querySelectorAll('button'))b.disabled=busy}
function mark(){dirty=true;$('confirmed').checked=false;$('empty').checked=false;$('saved').textContent='当前修改尚未保存';notify('')}
function checkpoint(){undo.push(JSON.parse(JSON.stringify(boxes)));if(undo.length>50)undo.shift()}
function progress(){const rows=items.filter(r=>state.records[r.stem]),accepted=rows.filter(r=>state.records[r.stem].status==='accepted').length;$('progress').textContent=`第 ${$('batch').value} 批 · ${items.length} 张 · 当前第 ${$('image').selectedIndex+1} 张 · 已审核 ${rows.length}（可评分 ${accepted}，暂扣 ${rows.length-accepted}）`;for(const o of $('image').options){const r=state.records[o.value];o.textContent=`${items.findIndex(i=>i.stem===o.value)+1} · ${items.find(i=>i.stem===o.value).tile}${r?(r.status==='accepted'?' · 已保存':' · 暂扣'):''}`}}
function objectList(){const list=$('objects');list.replaceChildren();boxes.forEach((b,i)=>{const p=document.createElement('div');p.className='object';const choose=document.createElement('button');choose.textContent=`滑坡 ${i+1}${Math.min(b[0],b[1])<=1||b[2]>=item.width-1||b[3]>=item.height-1?' · 触边':''}`;choose.className=selected===i?'selected':'';choose.onclick=()=>{selected=i;objectList();paint()};const remove=document.createElement('button');remove.textContent='删除';remove.onclick=()=>{checkpoint();boxes.splice(i,1);selected=-1;mode='add';mark();objectList();paint()};p.append(choose,remove);list.append(p)});$('mode').textContent=mode==='add'?'拖动新增滑坡框':`拖动重画滑坡 ${selected+1}`;enable()}
function rectangle(b,color,label){ctx.strokeStyle=color;ctx.lineWidth=2*canvas.width/Math.max(1,canvas.getBoundingClientRect().width);ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);if(label){ctx.font=`${Math.max(14,ctx.lineWidth*6)}px system-ui`;ctx.fillStyle=color;ctx.fillText(label,b[0]+4,Math.max(20,b[1]+20))}}
function paint(){if(!img)return;ctx.drawImage(img,0,0);if($('polygon').checked){ctx.save();ctx.strokeStyle='#ff6262';ctx.lineWidth=2*canvas.width/Math.max(1,canvas.getBoundingClientRect().width);for(const polygon of polygons){for(const ring of polygon.parts){ctx.beginPath();ring.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.stroke()}}ctx.restore()}if($('reference').checked)item.original_boxes.forEach(b=>rectangle(b,'#efca5d',''));boxes.forEach((b,i)=>rectangle(b,i===selected?'#7edcff':'#35e49c',String(i+1)));if(draft)rectangle(draft,'#fff','')}
function resize(){if(!item||!img)return;const width=Math.min(item.width,$('viewport').clientWidth,$('viewport').clientHeight*item.width/item.height)*Number($('zoom').value);canvas.style.width=width+'px';canvas.style.height=width*item.height/item.width+'px';paint()}
function canLeave(){return !busy&&(!dirty||confirm('当前图片修改尚未保存，确定离开吗？'))}
async function load(){const seq=++version;item=items.find(r=>r.stem===$('image').value);busy=true;img=null;polygons=[];$('polygon').disabled=true;$('polygonInfo').textContent='加载多边形…';enable();notify('加载原测试图片…');try{const im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=()=>reject(Error('图片加载失败'));im.src='/api/image?stem='+encodeURIComponent(item.stem)});let reference;try{reference=await request('/api/shp?stem='+encodeURIComponent(item.stem))}catch(e){reference={available:false,polygons:[],error:e.message}}if(seq!==version)return;polygons=reference.polygons;$('polygon').disabled=!reference.available;$('polygonInfo').textContent=reference.available?(polygons.length?`SHP参考 ${polygons.length} 个`:'当前图片没有SHP多边形；仍需检查是否漏标'):(reference.error?'多边形加载失败：'+reference.error:'SHP参考尚未准备');img=im;canvas.width=item.width;canvas.height=item.height;const r=state.records[item.stem];boxes=r?JSON.parse(JSON.stringify(r.boxes)):[];revision=r?.revision||0;selected=-1;mode='add';dirty=false;start=null;draft=null;undo=[];$('reason').value=r?.reason||'';$('reviewer').value=r?.reviewer||$('reviewer').value;$('confirmed').checked=Boolean(r);$('empty').checked=r?.empty_confirmed||false;$('saved').textContent=r?(r.status==='accepted'?'本图已保存':'本图已暂扣'):'尚未审核；可以自行画框，也可载入旧框后修订';$('identity').textContent=`${item.stem} · ${item.width} × ${item.height} · 原框 ${item.original_boxes.length} 个`;progress();busy=false;objectList();resize();notify('')}catch(e){busy=false;notify(e.message);enable()}}
function populate(){items=state.manifest.items.filter(r=>r.batch===Number($('batch').value));$('image').replaceChildren();for(const row of items){const o=document.createElement('option');o.value=row.stem;$('image').append(o)}const index=items.findIndex(r=>!state.records[r.stem]);$('image').selectedIndex=Math.max(0,index);lastImage=$('image').value;lastBatch=$('batch').value;load()}
$('image').onchange=()=>{if(!canLeave()){$('image').value=lastImage;return}lastImage=$('image').value;load()};$('batch').onchange=()=>{if(!canLeave()){$('batch').value=lastBatch;return}const url=new URL(location.href);url.searchParams.set('batch',$('batch').value);history.replaceState(null,'',url);populate()};for(const [id,step] of [['prev',-1],['next',1]])$(id).onclick=()=>{const i=$('image').selectedIndex+step;if(i<0||i>=items.length||!canLeave())return;$('image').selectedIndex=i;lastImage=$('image').value;load()};
$('copy').onclick=()=>{if(boxes.length&&!confirm('用旧框替换当前草稿吗？'))return;checkpoint();boxes=JSON.parse(JSON.stringify(item.original_boxes));selected=-1;mode='add';mark();objectList();paint()};$('add').onclick=()=>{mode='add';selected=-1;objectList();paint()};$('redraw').onclick=()=>{if(selected<0)return notify('先在右侧列表选中一个框');mode='redraw';objectList()};$('undo').onclick=()=>{if(!undo.length)return;boxes=undo.pop();selected=-1;mode='add';mark();objectList();paint()};$('reference').onchange=paint;$('polygon').onchange=paint;$('zoom').oninput=resize;window.onresize=resize;$('reason').oninput=mark;$('reviewer').oninput=mark;
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(item.width,(e.clientX-r.left)*item.width/r.width)),Math.max(0,Math.min(item.height,(e.clientY-r.top)*item.height/r.height))]}
canvas.onpointerdown=e=>{if(busy||!img||e.button!==0)return;if(mode==='redraw'&&selected<0)return;canvas.setPointerCapture(e.pointerId);start=point(e);draft=[...start,...start];paint()};canvas.onpointermove=e=>{if(!start)return;const p=point(e);draft=[Math.min(start[0],p[0]),Math.min(start[1],p[1]),Math.max(start[0],p[0]),Math.max(start[1],p[1])];paint()};canvas.onpointerup=e=>{if(!start)return;start=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(draft[2]-draft[0]>=1&&draft[3]-draft[1]>=1){checkpoint();if(mode==='redraw')boxes[selected]=draft;else{boxes.push(draft);selected=boxes.length-1}mark()}draft=null;objectList();paint()};canvas.onpointercancel=()=>{start=null;draft=null;paint()};
async function save(status){if(busy||!img)return;if(!$('confirmed').checked)return notify('请先勾选整张图片审核确认');if(status==='accepted'&&!boxes.length&&!$('empty').checked)return notify('空标签需要确认整张图片没有滑坡');if(!$('reason').value.trim())return notify('请填写判断依据');busy=true;enable();try{const result=await request('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Eval-Review':'1'},body:JSON.stringify({stem:item.stem,status,boxes,reviewer:$('reviewer').value,reason:$('reason').value,confirmed:true,empty_confirmed:$('empty').checked,revision})});state.records[item.stem]=result.saved;revision=result.saved.revision;dirty=false;$('saved').textContent=status==='accepted'?'本图已保存':'本图已暂扣';progress();notify('保存成功，可以继续下一张。')}catch(e){notify(e.message)}finally{busy=false;enable()}}
$('save').onclick=()=>save('accepted');$('hold').onclick=()=>save('unscorable');window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
(async()=>{try{state=await request('/api/state');for(const n of [...new Set(state.manifest.items.map(r=>r.batch))]){const o=document.createElement('option');o.value=n;o.textContent='第 '+n+' 批';$('batch').append(o)}const wanted=new URL(location.href).searchParams.get('batch');if([...$('batch').options].some(o=>o.value===wanted))$('batch').value=wanted;populate()}catch(e){notify(e.message)}})();
</script></html>
