<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>高分额外候选复核</title>
<style>body{margin:18px;background:#111;color:#ddd;font:16px system-ui}h1{font-size:22px}button,select,input,textarea{background:#232323;color:#eee;border:1px solid #666;border-radius:5px;padding:9px;font:inherit}button{cursor:pointer}button:hover{background:#353535}.layout{display:grid;grid-template-columns:minmax(400px,1fr) 340px;gap:16px}canvas{width:100%;height:auto;background:#000}aside{position:sticky;top:10px;align-self:start}aside button{display:block;width:100%;text-align:left;margin:8px 0}label{display:block;margin:10px 0}.muted{color:#aaa}#msg{white-space:pre-wrap}textarea{width:94%}.orange{color:#ffa540}.blue{color:#65b5ff}.pink{color:#eb8ccc}.green{color:#64d893}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static}}</style>
<h1>高分额外候选复核</h1><p>只判断<strong class="orange">橙色候选框</strong>是什么，无需重新画框。额外预测可能是漏标滑坡，也可能是偏框、重复框或背景。判断单独保存，不自动改训练或评估标签。</p>
<p><button id="prev">上一张</button> <select id="batch"></select> <select id="target"></select> <button id="next">下一张</button> <span id="progress"></span></p>
<p id="source_note" class="muted"></p><div class="layout"><section><p><select id="mode"><option value="native">原始图幅上下文</option><option value="original">模型当时看到的测试裁片</option></select> <label style="display:inline"><input id="refs" type="checkbox" checked>显示参考</label></p><canvas id="canvas"></canvas><p class="muted"><span class="orange">橙框：模型候选</span> · <span class="blue">蓝框：评分参考框</span> · <span class="pink">粉线：SHP多边形</span> · <span class="green">绿框：本次人工框</span>。上下文视图会抽样显示原图；蓝框只在测试裁片模式显示。参考只用于判断，不能直接当标准答案。</p></section>
<aside><p id="info"></p><label>审核人 <input id="reviewer" value="用户"></label><textarea id="reason" rows="2" placeholder="可选备注"></textarea><label><input id="confirmed" type="checkbox">我已查看橙框和周边</label><button data-status="known_localization">已知滑坡，但框大小或位置不对</button><button data-status="known_duplicate">已知滑坡的重复／碎框</button><button data-status="missing_landslide">这里有滑坡，评分标签漏标了</button><button data-status="true_background">确认橙框内没有滑坡</button><button data-status="uncertain">看不清，暂不能判断</button><p id="saved"></p><p id="msg"></p><p class="muted">该清单按模型预测挑选，不能单独代表整个测试集误报率。可以完成当前8774审核后再看这里。</p></aside></div>
<script>
const $=id=>document.getElementById(id);let state,items=[],item,meta,bitmap,request=0,loading=false,saving=false;
function buttons(disabled){document.querySelectorAll('[data-status]').forEach(b=>b.disabled=disabled)}
const names={known_localization:'偏框',known_duplicate:'重复／碎框',missing_landslide:'评分标签漏标',true_background:'确认背景',uncertain:'暂不能判断'};
async function api(url,options){const r=await fetch(url,options),v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v}
function list(){items=state.manifest.items.filter(i=>i.batch===Number($('batch').value));$('target').replaceChildren(...items.map(i=>{let o=document.createElement('option');o.value=i.candidate_id;o.textContent=i.candidate_id+' · '+i.tile+(state.records[i.candidate_id]?' ✓':'');return o}));$('progress').textContent='已判断 '+Object.keys(state.records).length+' / '+state.manifest.region_count+' 个候选区域'}
async function load(){let seq=++request;item=items.find(i=>i.candidate_id===$('target').value);if(!item)return;const current=item;loading=true;buttons(true);$('confirmed').checked=false;$('msg').textContent='正在加载…';try{const q='?id='+encodeURIComponent(item.candidate_id)+'&mode='+$('mode').value;const m=await api('/api/view'+q);const r=await fetch('/api/image'+q);if(!r.ok)throw Error('图像加载失败');const b=await createImageBitmap(await r.blob());if(seq!==request){b.close();return}meta=m;if(bitmap)bitmap.close();bitmap=b;draw();const saved=state.records[current.candidate_id];$('info').textContent=current.candidate_id+' · '+current.tile+'\n最高分 '+current.score.toFixed(3)+' · '+current.members.length+' 次重叠预测 · '+current.models.length+' 个模型';$('saved').textContent=saved?'已保存：'+names[saved.status]:'';$('reason').value=saved?.reason||'';$('msg').textContent='';loading=false;buttons(saving)}catch(e){if(seq===request)$('msg').textContent=e.message}}
function draw(){if(!bitmap)return;const c=$('canvas');c.width=meta.width;c.height=meta.height;const x=c.getContext('2d');x.drawImage(bitmap,0,0);const scale=c.width/1000;function box(b,color,width=2){x.strokeStyle=color;x.lineWidth=width*scale;x.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1])}if($('refs').checked){meta.old_boxes.forEach(b=>box(b,'#65b5ff'));meta.manual.forEach(r=>box(r.box,'#64d893'));x.strokeStyle='#eb8ccc';x.lineWidth=1.5*scale;meta.polygons.forEach(r=>r.parts.forEach(p=>{x.beginPath();p.forEach((v,i)=>i?x.lineTo(...v):x.moveTo(...v));x.closePath();x.stroke()}))}box(meta.prediction_box,'#ffa540',4)}
function move(delta){let n=$('target').selectedIndex+delta;if(n>=0&&n<items.length){$('target').selectedIndex=n;load()}}
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const current=item;try{if(loading||saving||meta?.candidate_id!==current.candidate_id)throw Error('请等待当前图像加载完成');saving=true;buttons(true);const v=await api('/api/save',{method:'POST',headers:{'Content-Type':'application/json','X-Manual-Review':'1'},body:JSON.stringify({candidate_id:current.candidate_id,status:b.dataset.status,confirmed:$('confirmed').checked,reviewer:$('reviewer').value,reason:$('reason').value,revision:state.records[current.candidate_id]?.revision||0})});state.records[current.candidate_id]=v;const id=$('target').value;list();$('target').value=id;if(current.candidate_id===id){$('saved').textContent='已保存：'+names[v.status];$('msg').textContent='保存成功';$('confirmed').checked=false}}catch(e){$('msg').textContent=e.message}finally{saving=false;buttons(loading)}});
$('batch').onchange=()=>{list();load()};$('target').onchange=load;$('mode').onchange=load;$('refs').onchange=draw;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
(async()=>{try{state=await api('/api/state');$('source_note').textContent='当前参考答案：'+(state.manifest.source_label||'旧SHP评估参考框');const batches=[...new Set(state.manifest.items.map(i=>i.batch))];$('batch').replaceChildren(...batches.map(n=>{let o=document.createElement('option');o.value=n;o.textContent='第 '+n+' 批';return o}));const q=new URLSearchParams(location.search);$('batch').value=q.get('batch')||batches[0];list();const id=q.get('id');if(id&&items.some(i=>i.candidate_id===id))$('target').value=id;await load()}catch(e){$('msg').textContent=e.message}})();
</script></html>
